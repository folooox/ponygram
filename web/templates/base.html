<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>{% block title %}Ponygram Admin{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    /* ── Theme variables ─────────────────────────────────────── */
    [data-bs-theme="dark"] {
      --pg-sidebar:  #111318;
      --pg-surface:  #1e2130;
      --pg-surface2: #1a2535;
      --pg-border:   rgba(255,255,255,.08);
      --pg-text-dim: #94a3b8;
    }
    [data-bs-theme="light"] {
      --pg-sidebar:  #f8fafc;
      --pg-surface:  #ffffff;
      --pg-surface2: #f1f5f9;
      --pg-border:   rgba(0,0,0,.1);
      --pg-text-dim: #64748b;
    }

    /* Override inline style="background:#1e2130" on .card elements */
    .card {
      background: var(--pg-surface) !important;
      border-color: var(--pg-border) !important;
    }

    :root { --sidebar-w: 220px; --topbar-h: 56px; }
    html, body { min-height: 100vh; }
    body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

    /* ── Top bar (mobile only) ───────────────────────────── */
    #topbar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--pg-sidebar);
      border-bottom: 1px solid var(--pg-border);
      z-index: 200;
      padding: 0 .75rem;
      align-items: center;
      gap: .5rem;
    }
    #topbar .brand-m {
      font-weight: 700;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 1.05rem;
    }
    #topbar .hamburger {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 1.4rem;
      padding: .3rem .55rem;
      border-radius: .35rem;
    }
    #topbar .hamburger:active { background: var(--pg-surface); }
    [data-bs-theme="light"] #topbar .brand-m { color: #1e293b; }
    [data-bs-theme="light"] #topbar .hamburger { color: #1e293b; }

    /* ── Sidebar ───────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--pg-sidebar);
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
      z-index: 250;
      transition: transform .25s ease;
      border-right: 1px solid var(--pg-border);
    }
    #sidebar .brand {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: 1.25rem 1rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #e2e8f0;
      text-decoration: none;
      border-bottom: 1px solid var(--pg-border);
    }
    [data-bs-theme="light"] #sidebar .brand { color: #1e293b; }
    #sidebar .brand-close {
      display: none;
      margin-left: auto;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      padding: 0 .25rem;
    }
    #sidebar .nav-link {
      color: #94a3b8;
      border-radius: .4rem;
      margin: 2px 8px;
      padding: .55rem .75rem;
      font-size: .9rem;
      display: flex;
      align-items: center;
    }
    [data-bs-theme="light"] #sidebar .nav-link { color: #64748b; }
    #sidebar .nav-link:hover  { color: #f1f5f9; background: #1e2130; }
    [data-bs-theme="light"] #sidebar .nav-link:hover { color: #1e293b; background: #e2e8f0; }
    #sidebar .nav-link.active { color: #f1f5f9; background: #2563eb; }
    #sidebar .nav-link i { width: 1.2em; }
    #sidebar .logout-link { color: #64748b !important; }

    /* ── Toolbar buttons (theme + lang) ───────────────────── */
    .toolbar-btn {
      background: transparent;
      border: 1px solid var(--pg-border);
      color: var(--pg-text-dim);
      border-radius: .35rem;
      padding: .25rem .5rem;
      font-size: .8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar-btn:hover { background: var(--pg-surface); }

    /* ── Backdrop ──────────────────────────────────────────── */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(2px);
      z-index: 240;
    }

    /* ── Main content ────────────────────────────────────────── */
    #main { margin-left: var(--sidebar-w); padding: 2rem; }
    .stat-card { border: none; border-radius: .75rem; }

    /* ── Mobile breakpoint ─────────────────────────────────────── */
    @media (max-width: 768px) {
      #topbar { display: flex; }
      #sidebar {
        transform: translateX(-100%);
        box-shadow: 4px 0 18px rgba(0,0,0,.4);
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar .brand-close { display: inline-block; }
      #sidebar-backdrop.show { display: block; }
      #main {
        margin-left: 0;
        padding: calc(var(--topbar-h) + 1rem) 1rem 1.5rem;
      }
      .card .card-body { padding: 1rem; }
      h4.fw-bold { font-size: 1.25rem; }
    }

    /* ── Even tighter on very small phones ──────────────────────── */
    @media (max-width: 380px) {
      #main { padding: calc(var(--topbar-h) + .75rem) .65rem 1rem; }
      .card .card-body { padding: .85rem; }
    }

    /* ── Make tables horizontally scrollable smoothly ─────────────── */
    .table-responsive { -webkit-overflow-scrolling: touch; }

    /* ── Larger tap targets on touch devices ───────────────────── */
    @media (hover: none) {
      .btn-sm { padding: .35rem .65rem; }
      .form-check-input { transform: scale(1.1); }
    }

    /* ── Light mode overrides ──────────────────────────────────── */
    [data-bs-theme="light"] body { background: #f1f5f9; color: #1e293b; }

    /* Info/hint panels with hardcoded dark backgrounds */
    [data-bs-theme="light"] [style*="1a2535"],
    [data-bs-theme="light"] [style*="161b27"],
    [data-bs-theme="light"] [style*="0d1017"] {
      background: #eff6ff !important;
      border-color: #93c5fd !important;
    }
    [data-bs-theme="light"] [style*="1e3a5f"] {
      background: #dbeafe !important;
      border-color: #60a5fa !important;
    }

    /* Form controls */
    [data-bs-theme="light"] .form-control,
    [data-bs-theme="light"] .form-select {
      background-color: #ffffff !important;
      color: #1e293b !important;
      border-color: #cbd5e1 !important;
    }
    [data-bs-theme="light"] .form-control::placeholder { color: #94a3b8 !important; }
    [data-bs-theme="light"] .form-control:focus,
    [data-bs-theme="light"] .form-select:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 .2rem rgba(59,130,246,.25) !important;
    }

    /* Bootstrap utility class overrides */
    [data-bs-theme="light"] .bg-dark       { background-color: #f1f5f9 !important; }
    [data-bs-theme="light"] .text-light    { color: #1e293b !important; }
    [data-bs-theme="light"] .border-secondary { border-color: #e2e8f0 !important; }
    [data-bs-theme="light"] .font-monospace { color: #1e293b !important; }

    /* Tables */
    [data-bs-theme="light"] .table        { color: #1e293b; }
    [data-bs-theme="light"] .table-dark   { --bs-table-bg: #f8fafc; --bs-table-color: #1e293b; color: #1e293b; }
    [data-bs-theme="light"] .table-hover > tbody > tr:hover > * { background-color: #e9f0fb; }
    [data-bs-theme="light"] .table-striped > tbody > tr:nth-of-type(odd) > * { background-color: #f8fafc; }

    /* Sidebar active link keeps white text */
    [data-bs-theme="light"] #sidebar .nav-link.active { color: #fff; }

    /* Modal */
    [data-bs-theme="light"] .modal-content { background: #ffffff !important; color: #1e293b; }
    [data-bs-theme="light"] .modal-header,
    [data-bs-theme="light"] .modal-footer { border-color: #e2e8f0 !important; }
    [data-bs-theme="light"] .btn-close-white { filter: invert(1) !important; }

    /* Badge/inline code */
    [data-bs-theme="light"] code { background: #e2e8f0; color: #be185d; padding: .1em .3em; border-radius: .25em; }
  </style>
  <script>
    /* Apply saved theme before first paint to prevent flash */
    (function() {
      const t = localStorage.getItem('pg-theme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
</head>
<body>

<header id="topbar">
  <button class="hamburger" type="button" onclick="toggleSidebar(true)" aria-label="Open menu">
    <i class="bi bi-list"></i>
  </button>
  <a href="/" class="brand-m">🐴 Ponygram</a>
  <div class="ms-auto d-flex gap-1">
    <button class="toolbar-btn" onclick="toggleTheme()" id="theme-btn-top" title="Toggle theme">
      <i class="bi bi-sun-fill" id="theme-icon-top"></i>
    </button>
    <button class="toolbar-btn" onclick="toggleLang()" id="lang-btn-top" title="Switch language">
      <span id="lang-label-top">EN</span>
    </button>
  </div>
</header>

<div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

<nav id="sidebar">
  <a href="/" class="brand">
    <span>🐴 Ponygram</span>
    <button class="brand-close" type="button" onclick="toggleSidebar(false)" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>
  </a>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li class="nav-item">
      <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/">
        <i class="bi bi-speedometer2"></i>
        <span data-zh="仪表盘" data-en="Dashboard">Dashboard</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'island' %}active{% endif %}" href="/island">
        <i class="bi bi-tree"></i>
        <span data-zh="海岛皮肤" data-en="Island UI">Island UI</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'groups' %}active{% endif %}" href="/groups">
        <i class="bi bi-people"></i>
        <span data-zh="群组" data-en="Groups">Groups</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'blacklist' %}active{% endif %}" href="/blacklist">
        <i class="bi bi-slash-circle"></i>
        <span data-zh="黑名单" data-en="Blacklist">Blacklist</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'rss' %}active{% endif %}" href="/rss">
        <i class="bi bi-rss"></i>
        <span data-zh="RSS" data-en="RSS">RSS</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'media' %}active{% endif %}" href="/media">
        <i class="bi bi-play-circle"></i>
        <span data-zh="媒体" data-en="Media">Media</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'media_errors' %}active{% endif %}" href="/media-errors">
        <i class="bi bi-exclamation-triangle"></i>
        <span data-zh="错误日志" data-en="Error Log">Error Log</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'psn_library' %}active{% endif %}" href="/psn-library">
        <i class="bi bi-controller"></i>
        <span data-zh="PS 库" data-en="PS Library">PS Library</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'ai_stats' %}active{% endif %}" href="/ai-stats">
        <i class="bi bi-robot"></i>
        <span data-zh="AI 统计" data-en="AI Stats">AI Stats</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'components' %}active{% endif %}" href="/components">
        <i class="bi bi-puzzle"></i>
        <span data-zh="组件中心" data-en="Components">Components</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'composer' %}active{% endif %}" href="/composer">
        <i class="bi bi-pencil-square"></i>
        <span data-zh="消息编辑器" data-en="Composer">Composer</span>
      </a>
    </li>
  </ul>
  <ul class="nav flex-column mb-2">
    <li class="nav-item px-2 mb-1 d-flex gap-1">
      <button class="toolbar-btn flex-grow-1" onclick="toggleTheme()" id="theme-btn">
        <i class="bi bi-sun-fill me-1" id="theme-icon"></i>
        <span id="theme-label">Light</span>
      </button>
      <button class="toolbar-btn flex-grow-1" onclick="toggleLang()" id="lang-btn">
        <span id="lang-label">EN</span>
      </button>
    </li>
    <li class="nav-item">
      <a class="nav-link logout-link" href="/logout">
        <i class="bi bi-box-arrow-left"></i>
        <span data-zh="登出" data-en="Logout">Logout</span>
      </a>
    </li>
  </ul>
</nav>

<main id="main">
  {% block content %}{% endblock %}
</main>

<script>
  /* ── Sidebar toggle ───────────────────────────────────────────── */
  function toggleSidebar(open) {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('sidebar-backdrop');
    if (open) { sb.classList.add('open'); bd.classList.add('show'); document.body.style.overflow = 'hidden'; }
    else      { sb.classList.remove('open'); bd.classList.remove('show'); document.body.style.overflow = ''; }
  }
  document.querySelectorAll('#sidebar .nav-link').forEach(el =>
    el.addEventListener('click', () => { if (window.innerWidth <= 768) toggleSidebar(false); })
  );
  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) toggleSidebar(false);
  });

  /* ── Theme toggle ─────────────────────────────────────────────── */
  function _applyTheme(theme) {
    document.documentElement.setAttribute('data-bs-theme', theme);
    const isDark = theme === 'dark';
    const icon   = isDark ? 'bi-sun-fill'  : 'bi-moon-fill';
    const label  = isDark ? 'Light'        : 'Dark';
    const iconEl  = document.getElementById('theme-icon');
    const iconTop = document.getElementById('theme-icon-top');
    const labelEl = document.getElementById('theme-label');
    if (iconEl)  { iconEl.className  = `bi ${icon} me-1`; }
    if (iconTop) { iconTop.className = `bi ${icon}`; }
    if (labelEl) labelEl.textContent = label;
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-bs-theme') || 'dark';
    const nxt = cur === 'dark' ? 'light' : 'dark';
    localStorage.setItem('pg-theme', nxt);
    _applyTheme(nxt);
  }

  /* ── Language toggle ──────────────────────────────────────────── */
  function _applyLang(lang) {
    const isCn = lang === 'zh';
    document.querySelectorAll('[data-zh][data-en]').forEach(el => {
      el.textContent = isCn ? el.dataset.zh : el.dataset.en;
    });
    const lbl  = document.getElementById('lang-label');
    const lblT = document.getElementById('lang-label-top');
    if (lbl)  lbl.textContent  = isCn ? '中' : 'EN';
    if (lblT) lblT.textContent = isCn ? '中' : 'EN';
  }

  function toggleLang() {
    const cur = localStorage.getItem('pg-lang') || 'en';
    const nxt = cur === 'en' ? 'zh' : 'en';
    localStorage.setItem('pg-lang', nxt);
    _applyLang(nxt);
  }

  /* ── Init ─────────────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function() {
    _applyTheme(localStorage.getItem('pg-theme') || 'dark');
    _applyLang(localStorage.getItem('pg-lang') || 'en');
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

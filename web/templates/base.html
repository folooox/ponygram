<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>{% block title %}Ponygram Admin{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root { --sidebar-w: 220px; --topbar-h: 56px; }
    html, body { min-height: 100vh; }
    body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

    /* ── Top bar (mobile only) ───────────────────────────── */
    #topbar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: #111318;
      border-bottom: 1px solid #1e2130;
      z-index: 200;
      padding: 0 .75rem;
      align-items: center;
      gap: .5rem;
    }
    #topbar .brand-m {
      font-weight: 700;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 1.05rem;
    }
    #topbar .hamburger {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 1.4rem;
      padding: .3rem .55rem;
      border-radius: .35rem;
    }
    #topbar .hamburger:active { background: #1e2130; }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: #111318;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
      z-index: 250;
      transition: transform .25s ease;
    }
    #sidebar .brand {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: 1.25rem 1rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #e2e8f0;
      text-decoration: none;
      border-bottom: 1px solid #1e2130;
    }
    #sidebar .brand-close {
      display: none;
      margin-left: auto;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      padding: 0 .25rem;
    }
    #sidebar .nav-link {
      color: #94a3b8;
      border-radius: .4rem;
      margin: 2px 8px;
      padding: .55rem .75rem;
      font-size: .9rem;
      display: flex;
      align-items: center;
    }
    #sidebar .nav-link:hover  { color: #f1f5f9; background: #1e2130; }
    #sidebar .nav-link.active { color: #f1f5f9; background: #2563eb; }
    #sidebar .nav-link i { width: 1.2em; }
    #sidebar .logout-link { color: #64748b !important; }

    /* ── Backdrop ────────────────────────────────────────── */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(2px);
      z-index: 240;
    }

    /* ── Main content ────────────────────────────────────── */
    #main { margin-left: var(--sidebar-w); padding: 2rem; }
    .stat-card { border: none; border-radius: .75rem; }

    /* ── Mobile breakpoint ───────────────────────────────── */
    @media (max-width: 768px) {
      #topbar { display: flex; }
      #sidebar {
        transform: translateX(-100%);
        box-shadow: 4px 0 18px rgba(0,0,0,.4);
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar .brand-close { display: inline-block; }
      #sidebar-backdrop.show { display: block; }
      #main {
        margin-left: 0;
        padding: calc(var(--topbar-h) + 1rem) 1rem 1.5rem;
      }
      .card .card-body { padding: 1rem; }
      h4.fw-bold { font-size: 1.25rem; }
    }

    /* ── Even tighter on very small phones ───────────────── */
    @media (max-width: 380px) {
      #main { padding: calc(var(--topbar-h) + .75rem) .65rem 1rem; }
      .card .card-body { padding: .85rem; }
    }

    /* ── Make tables horizontally scrollable smoothly ────── */
    .table-responsive { -webkit-overflow-scrolling: touch; }

    /* ── Larger tap targets on touch devices ─────────────── */
    @media (hover: none) {
      .btn-sm { padding: .35rem .65rem; }
      .form-check-input { transform: scale(1.1); }
    }
  </style>
</head>
<body>

<header id="topbar">
  <button class="hamburger" type="button" onclick="toggleSidebar(true)" aria-label="Open menu">
    <i class="bi bi-list"></i>
  </button>
  <a href="/" class="brand-m">🐴 Ponygram</a>
</header>

<div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

<nav id="sidebar">
  <a href="/" class="brand">
    <span>🐴 Ponygram</span>
    <button class="brand-close" type="button" onclick="toggleSidebar(false)" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>
  </a>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li class="nav-item">
      <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'groups' %}active{% endif %}" href="/groups">
        <i class="bi bi-people"></i> Groups
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'blacklist' %}active{% endif %}" href="/blacklist">
        <i class="bi bi-slash-circle"></i> Blacklist
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'rss' %}active{% endif %}" href="/rss">
        <i class="bi bi-rss"></i> RSS
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'settings' %}active{% endif %}" href="/settings">
        <i class="bi bi-gear"></i> Settings
      </a>
    </li>
  </ul>
  <ul class="nav flex-column mb-2">
    <li class="nav-item">
      <a class="nav-link logout-link" href="/logout">
        <i class="bi bi-box-arrow-left"></i> Logout
      </a>
    </li>
  </ul>
</nav>

<main id="main">
  {% block content %}{% endblock %}
</main>

<script>
  function toggleSidebar(open) {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('sidebar-backdrop');
    if (open) { sb.classList.add('open'); bd.classList.add('show'); document.body.style.overflow = 'hidden'; }
    else      { sb.classList.remove('open'); bd.classList.remove('show'); document.body.style.overflow = ''; }
  }
  // Close drawer when a nav link is tapped (mobile)
  document.querySelectorAll('#sidebar .nav-link').forEach(el =>
    el.addEventListener('click', () => { if (window.innerWidth <= 768) toggleSidebar(false); })
  );
  // Reset state on resize back to desktop
  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) toggleSidebar(false);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ponygram Admin{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root { --sidebar-w: 220px; }
    body { min-height: 100vh; }
    #sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: #111318;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
      z-index: 100;
    }
    #sidebar .brand {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: 1.25rem 1rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #e2e8f0;
      text-decoration: none;
      border-bottom: 1px solid #1e2130;
    }
    #sidebar .nav-link {
      color: #94a3b8;
      border-radius: .4rem;
      margin: 2px 8px;
      padding: .5rem .75rem;
      font-size: .9rem;
    }
    #sidebar .nav-link:hover { color: #f1f5f9; background: #1e2130; }
    #sidebar .nav-link.active  { color: #f1f5f9; background: #2563eb; }
    #sidebar .nav-link i { width: 1.2em; }
    #sidebar .logout-link { color: #64748b !important; }
    #main { margin-left: var(--sidebar-w); padding: 2rem; }
    .stat-card { border: none; border-radius: .75rem; }
    @media (max-width: 768px) {
      #sidebar { position: static; width: 100%; min-height: auto; flex-direction: row; flex-wrap: wrap; }
      #main { margin-left: 0; }
    }
  </style>
</head>
<body>

<nav id="sidebar">
  <a href="/" class="brand">🐴 Ponygram</a>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li class="nav-item">
      <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'groups' %}active{% endif %}" href="/groups">
        <i class="bi bi-people"></i> Groups
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'blacklist' %}active{% endif %}" href="/blacklist">
        <i class="bi bi-slash-circle"></i> Blacklist
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'rss' %}active{% endif %}" href="/rss">
        <i class="bi bi-rss"></i> RSS
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active == 'settings' %}active{% endif %}" href="/settings">
        <i class="bi bi-gear"></i> Settings
      </a>
    </li>
  </ul>
  <ul class="nav flex-column mb-2">
    <li class="nav-item">
      <a class="nav-link logout-link" href="/logout">
        <i class="bi bi-box-arrow-left"></i> Logout
      </a>
    </li>
  </ul>
</nav>

<main id="main">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

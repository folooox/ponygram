<style>
/* Ponygram island theme: inspired by guokaigdg/animal-island-ui design tokens. */
:root,[data-bs-theme="light"]{--is-bg:#f8f8f0;--is-card:#f7f3df;--is-panel:#fffdf5;--is-text:#725d42;--is-muted:#806f58;--is-border:#e0d8c6;--is-mint:#19c8b9;--is-tint:#e6f9f6;--is-shadow:#bdaea0;--sidebar-w:240px;--pg-sidebar:#eef7ee;--pg-surface:var(--is-card);--pg-surface2:var(--is-panel);--pg-border:var(--is-border);--pg-text-dim:var(--is-muted);--bs-body-color:var(--is-text);--bs-body-bg:var(--is-bg);--bs-secondary-color:var(--is-muted);--bs-border-color:var(--is-border);--bs-link-color:#14796d;--bs-link-hover-color:#0e6259}
[data-bs-theme="dark"]{--is-bg:#202e2a;--is-card:#2b3c34;--is-panel:#31463c;--is-text:#f4ebd7;--is-muted:#c0cbbd;--is-border:#52665a;--is-tint:#34554a;--is-shadow:#14231c;--pg-sidebar:#263a31;--pg-surface:var(--is-card);--pg-surface2:var(--is-panel);--pg-border:var(--is-border);--pg-text-dim:var(--is-muted);--bs-body-color:var(--is-text);--bs-body-bg:var(--is-bg);--bs-secondary-color:var(--is-muted);--bs-border-color:var(--is-border);--bs-link-color:#79dfc5;--bs-link-hover-color:#a8ecdc}
html body{font-family:'Nunito','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--is-bg)!important;color:var(--is-text);line-height:1.65;background-image:radial-gradient(var(--is-border) .7px,transparent .7px)!important;background-size:18px 18px!important}
#sidebar{background:var(--pg-sidebar);border-right:2px solid var(--is-border);padding:12px 8px}
#sidebar .brand,#topbar .brand-m,#topbar .hamburger{color:var(--is-text)!important}

#sidebar .nav-link:hover{background:var(--is-tint)!important;transform:translateX(2px)}
#sidebar .nav-link.active{background:#19c8b9!important;color:#163e35!important;box-shadow:0 3px 0 #0eaa9d}
#sidebar .logout-link{color:var(--is-muted)!important}#topbar{background:var(--pg-sidebar);border-bottom:2px solid var(--is-border)}
#main{padding:32px 36px 48px;max-width:1660px}h1,h2,h3,h4,h5,h6{color:var(--is-text);letter-spacing:.01em}h4.fw-bold{font-size:1.6rem}

.card .card-body{padding:24px}.card-header,.card-footer{background:transparent!important;border-color:var(--is-border)!important;padding:16px 24px}.card-header:first-child{border-radius:22px 22px 0 0}
.stat-card .fs-2{font-size:2.5rem!important}.stat-card{min-height:145px}.stat-card .bi{color:#14796d}.row:has(>.col-sm-6) .col-sm-6:nth-child(2) .stat-card{background:var(--is-tint)!important}
body .text-secondary,body .text-muted{color:var(--is-muted)!important}body .text-light{color:var(--is-text)!important}body .bg-dark{background:var(--is-panel)!important}body .border-secondary{border-color:var(--is-border)!important}
body .form-control,body .form-select,body .input-group-text{background:var(--is-panel)!important;color:var(--is-text)!important;border:2px solid var(--is-border)!important;border-radius:16px;min-height:42px;padding:8px 13px}body .form-control::placeholder{color:var(--is-muted)!important;opacity:.8}body .form-control:focus,body .form-select:focus{border-color:#19c8b9!important;box-shadow:0 0 0 3px rgba(25,200,185,.18)!important}.form-label{font-weight:650}.input-group>.form-control{border-radius:16px 0 0 16px}.input-group>.btn{border-radius:0 16px 16px 0}.form-check-input{border:2px solid var(--is-border);cursor:pointer}.form-check-input:checked{background-color:#149f91;border-color:#149f91}
body .btn{border-radius:50px;font-weight:700;border-width:2px;padding:8px 18px;transition:transform .15s,box-shadow .15s}.btn-sm{font-size:.8rem!important;padding:5px 12px!important}body .btn-primary{background:#f8f8f0;border-color:#cbbb9f;color:#794f27;box-shadow:0 4px 0 #bdaea0}body .btn-primary:hover{background:#fffdf5;border-color:#bdaea0;color:#794f27;transform:translateY(-1px)}body .btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #bdaea0}body .btn-success{background:#6fba2c;border-color:#6fba2c;color:#203b15;box-shadow:0 3px 0 #5a9e1e}body .btn-danger{background:#e05a5a;border-color:#e05a5a;color:white;box-shadow:0 3px 0 #c94444}body .btn-outline-primary,body .btn-outline-info{color:var(--bs-link-color);border-color:#19a99b;background:var(--is-panel)}body .btn-outline-primary:hover,body .btn-outline-info:hover{background:var(--is-tint);color:var(--is-text)}body .btn-outline-secondary{color:var(--is-text);border-color:var(--is-border)}.toolbar-btn{border-radius:16px;padding:6px 10px;color:var(--is-text)}.btn:focus-visible,.toolbar-btn:focus-visible,a:focus-visible{outline:3px solid #f5c31c;outline-offset:3px}.btn:disabled{box-shadow:none;transform:none}
body .table,body .table-dark{--bs-table-bg:transparent;--bs-table-color:var(--is-text);--bs-table-border-color:var(--is-border);--bs-table-striped-bg:var(--is-panel);--bs-table-striped-color:var(--is-text);--bs-table-hover-bg:var(--is-tint);--bs-table-hover-color:var(--is-text);color:var(--is-text)}.table>thead>tr>th{background:var(--is-panel);font-size:.8rem;color:var(--is-muted);font-weight:750;padding:13px 12px}.table td{padding:12px;vertical-align:middle}.table-responsive{border-radius:16px}.badge{border-radius:12px;padding:6px 9px}.list-group-item{background:var(--is-panel);color:var(--is-text);border-color:var(--is-border)}
body [style*="1a2535"],body [style*="161b27"],body [style*="0d1017"],body [style*="1e3a5f"],body [style*="2a2f45"]{background:var(--is-panel)!important;border-color:var(--is-border)!important;color:var(--is-text)!important}.modal-header,.modal-footer{border-color:var(--is-border)!important}.nav-tabs{border-color:var(--is-border)}.nav-tabs .nav-link{color:var(--is-muted);border-radius:14px 14px 0 0}.nav-tabs .nav-link.active{background:var(--is-card);color:var(--is-text);border-color:var(--is-border)}code{color:var(--bs-link-color);background:var(--is-panel);border-radius:6px;padding:2px 4px}.alert{border-radius:18px;border-width:2px}.dropdown-menu{background:var(--is-panel);border:2px solid var(--is-border);border-radius:16px}.dropdown-item{color:var(--is-text)}.dropdown-item:hover{background:var(--is-tint)}
.island-welcome{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;padding:26px 30px;background:var(--is-tint);border:2px dashed #94c9af;border-radius:28px}.island-welcome p{margin:6px 0 0;color:var(--is-muted)}.island-eyebrow{font-size:.75rem;letter-spacing:.14em;font-weight:800;color:var(--bs-link-color)}.island-mark{font-size:3.4rem;line-height:1}.login-card{width:min(420px,calc(100vw - 32px));padding:32px!important}.login-page{padding:24px;min-height:100vh;display:grid;place-items:center}.login-emblem{width:80px;height:80px;display:grid;place-items:center;margin:0 auto 20px;background:var(--is-tint);border:2px dashed #94c9af;border-radius:26px;font-size:2.6rem}
@media(max-width:768px){ #main{padding:calc(var(--topbar-h) + 20px) 16px 32px}#sidebar{width:240px}.island-welcome{padding:20px;gap:12px}.island-mark{font-size:2.5rem}.card .card-body{padding:18px}h4.fw-bold{font-size:1.3rem}.island-welcome h4{font-size:1.4rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ponygram Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d1117; }
    .login-card { width: 360px; border-radius: 1rem; background: #161b22; border: 1px solid #21262d; }
  </style>
</head>
<body>
  <div class="login-card p-4 shadow-lg">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem">🐴</div>
      <h5 class="mt-2 fw-bold">Ponygram Admin</h5>
      <p class="text-secondary small">Enter your admin password to continue</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label text-secondary small">Password (WEB_SECRET)</label>
        <input type="password" name="password" class="form-control" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</body>
</html>

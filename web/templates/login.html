<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ponygram Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  {% include "island_theme.html" %}
</head>
<body class="login-page">
  <div class="login-card p-4 shadow-lg">
    <div class="text-center mb-4">
      <div class="login-emblem">🐴</div>
      <h5 class="mt-2 fw-bold">Ponygram 小岛</h5>
      <p class="text-secondary small">欢迎回来，登录后开始照看你的小岛</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label for="password" class="form-label text-secondary small">管理密码</label>
        <input type="password" id="password" name="password" autocomplete="current-password" class="form-control" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100">进入小岛 →</button>
    </form>
  </div>
</body>
</html>

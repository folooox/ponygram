name: Create Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if v1.0.0 release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create v1.0.0 release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            --target main \
            --title "v1.0.0 — v3 Refactor + Install Wizard" \
            --notes "## What's new

### v3 Architecture
- **Group activation system** — groups must be activated by the owner via Web UI before any features work
- **Natural AI triggers** — @mention, \`pony \` prefix, or reply to bot (no slash commands)
- **URL auto-detection** — paste a YouTube/TikTok/Instagram/etc. link → auto-download and send
- **Inline media search** — \`@bot movie/tv/book/music/artist <query>\`
- All configuration moved to **Web Admin UI**

### Web Admin UI
- New \`/settings\` page — configure Claude, TMDB, and Last.fm API keys in the browser
- New \`/rss\` page — manage RSS subscriptions
- Group search + activation with live Telegram API preview
- Welcome/goodbye message editing per group

### Install Wizard
- \`install.sh\` — one-liner curl install with interactive config wizard
- Checks Python 3.10+, pip, ffmpeg; offers auto-install per OS
- Docker Compose or bare-metal venv deployment
- Generates \`.env\` with all required settings
- Optional systemd service setup

### Removed slash commands
All config commands moved to Web UI or natural triggers:
\`/setwelcome\`, \`/antispam\`, \`/antiad\`, \`/rss\`, \`/dlmode\`, \`/aichat\`, \`/warnlimit\`, \`/gblacklist\`, \`/gunblacklist\`, \`/movie\`, \`/tv\`, \`/book\`, \`/music\`, \`/artist\`, \`/dl\`, \`/dlinfo\`, \`/chat\`, \`/ask\`, \`/clearchat\`"

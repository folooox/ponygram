services:
  ponygram:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      # Web admin UI (set WEB_ENABLED=true in .env to activate)
      - "8080:8080"
      # Uncomment for webhook mode (set WEBHOOK_URL in .env)
      # - "8443:8443"
